name: 构建瀑布相册 TV APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android-tv/**'
      - 'android/keystore/**'
      - '.github/workflows/build-android-tv.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # 与手机端同样用 ubuntu-latest；构建不依赖 runner 预装内容：
    # setup-android@v4 自装 cmdline-tools，sdkmanager 走定位到的绝对路径，
    # 显式安装 android-34 与 build-tools 34.0.0，build.sh 固定取 34.0.0
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 准备 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: 安装 platform 与 build-tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ]; then
            SDKM="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -1 || true)"
          fi
          if [ -z "$SDKM" ] || [ ! -x "$SDKM" ]; then
            echo "❌ 找不到 sdkmanager，SDK 目录结构如下："
            find "$SDK_ROOT" -maxdepth 3 -type d 2>/dev/null || true
            exit 1
          fi
          echo "使用 sdkmanager: $SDKM"
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: 校验构建环境（失败时给出明确诊断）
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -f "$SDK_ROOT/platforms/android-34/android.jar" || {
            echo "❌ 缺少 android.jar"; ls -la "$SDK_ROOT/platforms" || true; exit 1; }
          ls -d "$SDK_ROOT/build-tools"/* || { echo "❌ 缺少 build-tools"; exit 1; }

      # TV 版与手机端共用仓库里那把密钥；若配置了 Secret 则两边都覆盖，
      # 保证两个 APK 仍是同一签名
      - name: 可选：从 Secrets 覆盖签名密钥
        env:
          KS_B64: ${{ secrets.WATERFALL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | base64 -d > android/keystore/release.p12
            echo "已使用 Secrets 中的签名密钥"
          fi

      - name: 检查构建输入是否提交完整
        run: |
          test -f android-tv/build.sh || {
            echo "❌ 仓库里没有 android-tv/build.sh，请确认 android-tv/ 已一并提交"; exit 1; }
          test -f android-tv/app/src/main/AndroidManifest.xml || {
            echo "❌ 缺少 TV AndroidManifest.xml"; exit 1; }
          test -f android-tv/app/src/main/res/drawable-xhdpi/tv_banner.png || {
            echo "❌ 缺少 TV banner（320x180）"; exit 1; }
          test -f android/keystore/release.p12 || {
            echo "❌ 缺少签名密钥；若改用 Secrets，请确认已配置 WATERFALL_KEYSTORE_BASE64"; exit 1; }

      - name: 编译并签名 TV APK
        run: bash android-tv/build.sh

      - name: 上传可安装的 TV APK
        uses: actions/upload-artifact@v7
        with:
          name: 瀑布相册-TV-APK
          path: android-tv/out/waterfall-album-tv.apk
          if-no-files-found: error
          retention-days: 30

      - name: 输出校验和
        run: shasum -a 256 android-tv/out/waterfall-album-tv.apk

      - name: 失败时输出环境快照
        if: failure()
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"
          java -version 2>&1 || true
          find "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}" -maxdepth 2 -type d 2>/dev/null | head -30 || true
