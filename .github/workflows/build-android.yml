name: 构建瀑布相册 APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # 用 ubuntu-latest：自动跟进安全更新，不必手动换 runner 标签。
    # 能安全用 latest 是因为构建不依赖 runner 预装内容：setup-android@v4
    # 自装 cmdline-tools、sdkmanager 走绝对路径、显式安装 android-34 与
    # build-tools 34.0.0，build.sh 也固定取 34.0.0 而不是「最高版本」。
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # v1~v4 已弃用且仍用 Node 20（被强制 Node 24 运行），升级到最新稳定版
      - name: 准备 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # v4 用 Node 24、自动接受 SDK 许可；packages 置空跳过默认安装，
      # 后面统一用定位到的 sdkmanager 装齐，避免依赖 PATH
      - name: 准备 Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: 安装 platform 与 build-tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ]; then
            SDKM="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -1 || true)"
          fi
          if [ -z "$SDKM" ] || [ ! -x "$SDKM" ]; then
            echo "❌ 找不到 sdkmanager，SDK 目录结构如下："
            find "$SDK_ROOT" -maxdepth 3 -type d 2>/dev/null || true
            exit 1
          fi
          echo "使用 sdkmanager: $SDKM"
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: 校验构建环境（失败时给出明确诊断）
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -f "$SDK_ROOT/platforms/android-34/android.jar" || {
            echo "❌ 缺少 android.jar"; ls -la "$SDK_ROOT/platforms" || true; exit 1; }
          ls -d "$SDK_ROOT/build-tools"/* || { echo "❌ 缺少 build-tools"; exit 1; }

      # 默认用仓库里那份专用自签名密钥（零配置、保证覆盖安装签名一致）。
      # 若不想把密钥放进仓库，可把 android/keystore/release.p12 加入 .gitignore，
      # 再用 `base64 -i release.p12` 的输出配置 Secret WATERFALL_KEYSTORE_BASE64。
      - name: 可选：从 Secrets 覆盖签名密钥
        env:
          KS_B64: ${{ secrets.WATERFALL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | base64 -d > android/keystore/release.p12
            echo "已使用 Secrets 中的签名密钥"
          fi

      - name: 检查构建输入是否提交完整
        run: |
          test -f android/build.sh || {
            echo "❌ 仓库里没有 android/build.sh，请确认 android/ 目录已一并提交"; exit 1; }
          test -f android/app/src/main/AndroidManifest.xml || {
            echo "❌ 缺少 AndroidManifest.xml"; exit 1; }
          test -f android/keystore/release.p12 || {
            echo "❌ 缺少签名密钥；若改用 Secrets，请确认已配置 WATERFALL_KEYSTORE_BASE64"; exit 1; }

      - name: 编译并签名 APK
        run: bash android/build.sh

      - name: 上传可安装的 APK
        uses: actions/upload-artifact@v7
        with:
          name: 瀑布相册-APK
          path: android/out/waterfall-album.apk
          if-no-files-found: error
          retention-days: 30

      - name: 输出校验和
        run: shasum -a 256 android/out/waterfall-album.apk

      # 任何一步失败都留一份环境快照，避免下次又只看到「9s 失败」没有线索
      - name: 失败时输出环境快照
        if: failure()
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "JAVA_HOME=$JAVA_HOME"
          echo "sdkmanager=$(command -v sdkmanager || echo 未找到)"
          java -version 2>&1 || true
          find "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}" -maxdepth 2 -type d 2>/dev/null | head -30 || true
