name: 构建瀑布相册 APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK
        uses: android-actions/setup-android@v3

      - name: 接受 SDK 许可
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: 安装 platform 与 build-tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null

      - name: 输出构建环境（首次排错用）
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools"

      # 默认用仓库里那份专用自签名密钥（零配置、保证覆盖安装签名一致）。
      # 若不想把密钥放进仓库，可把 android/keystore/release.p12 加入 .gitignore，
      # 再用 `base64 -i release.p12` 的输出配置 Secret WATERFALL_KEYSTORE_BASE64。
      - name: 可选：从 Secrets 覆盖签名密钥
        env:
          KS_B64: ${{ secrets.WATERFALL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | base64 -d > android/keystore/release.p12
            echo "已使用 Secrets 中的签名密钥"
          fi

      - name: 编译并签名 APK
        run: bash android/build.sh

      - name: 上传可安装的 APK
        uses: actions/upload-artifact@v7
        with:
          name: 瀑布相册-APK
          path: android/out/waterfall-album.apk
          if-no-files-found: error
          retention-days: 30

      - name: 输出校验和
        run: shasum -a 256 android/out/waterfall-album.apk
