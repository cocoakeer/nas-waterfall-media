name: Build linux/amd64 only, no push
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04   # 固定版本，避免 ubuntu-latest 未来迁移到 Ubuntu 26 的不确定性
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build linux/amd64 and export tar
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/amd64
          tags: nas-waterfall-media:latest
          outputs: type=docker,dest=/tmp/nas-waterfall-media.tar

      - name: Upload tar artifact
        uses: actions/upload-artifact@v7
        with:
          name: nas-waterfall-media-image
          path: /tmp/nas-waterfall-media.tar
          retention-days: 1
