services:
  nas-waterfall-media:
    image: nas-waterfall-media:latest
    container_name: nas-waterfall-media
    restart: always
    network_mode: host
    #ports:
      # 宿主机8000访问，容器内部8000
      #- "8000:8000"
    environment:
      MEDIA_ROOT: /media
      CONFIG_PATH: /config
      CACHE_PATH: /cache
      SLIDE_DEFAULT_DELAY: 3
      # 下面四行写的都是当前默认值：保持注释与不配置完全等价，
      # 只有要改策略时才取消注释并调整。默认值见 backend/main.py、backend/login_guard.py
      # 挂在反向代理后面才设为 "1"（会读 X-Forwarded-For；该头客户端可伪造，
      # 必须先在代理层清洗，否则攻击者能靠换请求头绕过来源 IP 锁定）。默认：关闭
      # TRUST_PROXY_HEADERS: "0"
      # IP 维度：600 秒窗口内累计失败 10 次 → 限制 300 秒。
      # 多台设备共用一个出口 IP 时，可调高阈值
      # LOGIN_IP_FAIL_THRESHOLD: 10
      # LOGIN_IP_WINDOW_SEC: 600
      # LOGIN_IP_LOCK_SEC: 300
    volumes:
      # ========= 修改这里为你NAS真实媒体目录路径 =========
      - ./media:/media:ro
      # 配置持久化，和compose.yml同级生成config文件夹
      - ./config:/config
      # 缩略图缓存持久化，体积会变大，可随时清空
      - ./cache:/cache

    # Mac下uid 1000容易权限报错，有读写报错再启用，正常就注释掉
    # user: "1000:1000"
