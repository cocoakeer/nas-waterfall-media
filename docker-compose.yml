services:
  nas-waterfall-media:
    image: nas-waterfall-media:latest
    container_name: nas-waterfall-media
    restart: always
    network_mode: host
    #ports:
      # 宿主机8000访问，容器内部8000
      #- "8000:8000"
    environment:
      MEDIA_ROOT: /media
      CONFIG_PATH: /config
      CACHE_PATH: /cache
      SLIDE_DEFAULT_DELAY: 3
      # 挂在反向代理后面时才开（会读 X-Forwarded-For；该头客户端可伪造，
      # 必须先在代理层清洗，否则登录锁定的来源 IP 能被绕过）
      # TRUST_PROXY_HEADERS: 1
      # 多台设备共用同一个出口 IP 时，可调高登录失败限速阈值/窗口
      # LOGIN_IP_FAIL_THRESHOLD: 20
      # LOGIN_IP_WINDOW_SEC: 600
      # LOGIN_IP_LOCK_SEC: 300
    volumes:
      # ========= 修改这里为你NAS真实媒体目录路径 =========
      - ./media:/media:ro
      # 配置持久化，和compose.yml同级生成config文件夹
      - ./config:/config
      # 缩略图缓存持久化，体积会变大，可随时清空
      - ./cache:/cache

    # Mac下uid 1000容易权限报错，有读写报错再启用，正常就注释掉
    # user: "1000:1000"
